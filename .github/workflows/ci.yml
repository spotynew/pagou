name: Validar aplicação

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_placeholder
      MERCADO_PAGO_ENABLED: "false"
      PAYMENTS_DEMO_MODE: "false"

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Auditar vulnerabilidades críticas
        run: npm audit --omit=dev --audit-level=critical

      - name: Verificar tipos
        run: npm run typecheck

      - name: Verificar lint semântico
        run: npm run lint:ci

      - name: Gerar build
        run: npm run build
