name: Sincronizar package lock

on:
  push:
    branches:
      - agent/evento-confianca-pix

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: agent/evento-confianca-pix

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sincronizar package-lock
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund

      - name: Enviar lockfile atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json já está sincronizado"
            exit 0
          fi
          git commit -m "Sincroniza package-lock com package.json"
          git push
