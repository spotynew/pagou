name: Sincronizar lockfile

on:
  push:
    branches:
      - agent/security-performance-vercel
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-performance-vercel
          persist-credentials: true

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sincronizar package-lock
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund

      - name: Enviar lockfile atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json já está sincronizado"
            exit 0
          fi
          git commit -m "Sincroniza package-lock com package.json"
          git push origin HEAD:agent/security-performance-vercel
