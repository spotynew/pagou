name: Sincronizar lockfile de segurança

on:
  push:
    branches:
      - agent/security-performance-vercel

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-performance-vercel
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund
      - name: Commitar lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "lockfile já sincronizado"
            exit 0
          fi
          git commit -m "Atualiza lockfile com correções de segurança"
          git push
